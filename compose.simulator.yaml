# Protocol-aware development simulator. Loopback TX/RX; no RF, no crypto, no multihop.
services:
  simulator:
    build: ./simulator
    restart: unless-stopped
    expose:
      - "5000"
  remoteterm:
    environment:
      MESHCORE_TCP_HOST: simulator
      MESHCORE_TCP_PORT: "5000"
    depends_on:
      - simulator
